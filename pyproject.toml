
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-ecommerce-data-pipeline"
version = "0.1.0"
description = "Pipeline de Engenharia de Dados com DummyJSON, Python e Azure"
requires-python = ">=3.12,<3.13"

dependencies = [
    "requests>=2.32,<3",
    "azure-storage-file-datalake>=12.17,<13",
    "azure-identity>=1.17,<2",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
